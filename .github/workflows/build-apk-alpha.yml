name: Build Compose APK (Alpha)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Assemble alphaRelease
        run: ./gradlew :app:assembleAlphaRelease --stacktrace --info

      - name: Debug: list APK outputs
        if: success()
        run: |
          echo "---- find APK files ----"
          find app/build/outputs -type f -name "*.apk" -print || true
          echo "---- list apk dir ----"
          ls -la app/build/outputs/apk || true

      - name: Find APK file
        id: find_apk
        if: success()
        run: |
          apk=$(find app/build/outputs -type f -name "*.apk" | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "No APK found"
          else
            echo "Found APK: $apk"
            echo "apk_path=$apk" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        if: success() && steps.find_apk.outputs.apk_path != ''
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Build Compose APK (alpha) #${{ github.run_number }}
          body: Automated build (alpha) from run ${{ github.run_number }}
          draft: false
          prerelease: true

      - name: Upload APK to Release
        if: success() && steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk_path }}
          asset_name: app-alpha-release-${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive
